<!doctype html><meta charset="utf-8"><body><script>const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(i,0,0,32,32);const p=document.createElement('pre');p.id='png';p.textContent=c.toDataURL('image/png');document.body.append(p)};i.src='../images/logo.svg';</script>
