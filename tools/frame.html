<!doctype html><meta charset="utf-8"><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;display:block;overflow:hidden}</style>
<iframe id="f"></iframe>
<script>const p=new URLSearchParams(location.search);const f=document.getElementById('f');f.onload=()=>{const d=f.contentDocument;d.documentElement.style.scrollBehavior='auto';const el=p.get('el')?d.querySelector(p.get('el')):null;const y=el?el.getBoundingClientRect().top+f.contentWindow.scrollY-(+p.get('off')||80):(+p.get('y')||0);f.contentWindow.scrollTo(0,y)};if(p.get('w')){f.style.width=p.get('w')+'px';document.body.style.background='#ddd';}const sl=+p.get('sl')||0;if(sl){const o=f.onload;f.onload=()=>{o();const t=f.contentDocument.querySelector(p.get('el'));t&&t.scrollIntoView?0:0;const tw=f.contentDocument.querySelector(p.get('sel')||'.table-wrap');if(tw)tw.scrollLeft=sl;};}f.src=p.get('u');</script>
